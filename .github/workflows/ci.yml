name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      UV_NO_PROGRESS: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.11

      - name: Sync locked dependencies
        run: uv sync --locked

      - name: Lint
        env:
          UV_OFFLINE: "1"
        run: uv run ruff check .

      - name: Check formatting
        env:
          UV_OFFLINE: "1"
        run: uv run ruff format --check .

      - name: Test without external API access
        env:
          DEEPSEEK_API_KEY: ""
          UV_OFFLINE: "1"
        run: uv run pytest -q -p no:cacheprovider
